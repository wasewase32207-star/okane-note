`
.app{--ink:#16233B;--ink2:#56627A;--paper:#EEF1F6;--card:#FFFFFF;--line:#DAE0EA;--cobalt:#2748D6;--teal:#0C8678;--amber:#C9780E;--red:#C4372D;
  min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.5;display:flex;justify-content:center}
.app *{box-sizing:border-box}
.page{width:100%;max-width:480px;padding:18px 16px 96px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

.hero{padding:6px 4px 14px}
.hero-label{font-size:14px;color:var(--ink2)}
.hero-pair{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.hero-sub{font-size:12.5px;color:var(--ink2);margin-top:4px}
.hero-num.alt{font-size:30px;color:var(--ink2)}
.hero-num.alt.neg{color:var(--red)}
.setup{border-color:var(--cobalt)}
.hero-num{font-size:44px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.hero-num.neg{color:var(--red)}
.hero-eq{font-size:12.5px;color:var(--ink2);margin-top:2px}
.hero-cards{margin-top:8px;font-size:13px;color:var(--ink2)}
.hero-cards b{color:var(--ink)}
.hero-cards em{font-style:normal;color:var(--amber)}

.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.card h3{font-size:15px;margin:0 0 10px}
.entry{padding:14px}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-size:14px;color:var(--ink2);font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
.seg.small{margin-top:8px}
.seg.small button{padding:6px 0;font-size:13px}
.amount-row{display:flex;align-items:baseline;gap:6px;margin:14px 2px 10px;border-bottom:2px solid var(--ink)}
.yen{font-size:26px;font-weight:700;color:var(--ink2)}
.amount{flex:1;min-width:0;border:0;background:transparent;font-size:38px;font-weight:800;color:var(--ink);padding:2px 0;font-family:inherit}
.amount:focus-visible{outline:none}
.amount-row:focus-within{border-color:var(--cobalt)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-size:14px}
.chip.big{padding:11px 16px;font-size:15px;font-weight:600}
.chip.small{padding:7px 12px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.chips.subs{margin-top:-2px}
.mini-label{font-size:12.5px;color:var(--ink2);margin-top:8px}
.hint{font-size:12.5px;color:var(--ink2);margin:8px 0}
.link{border:0;background:transparent;color:var(--cobalt);font-size:13px;padding:6px 0;text-decoration:underline}
.link.danger{color:var(--red)}
.more{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
.btn-main{width:100%;margin-top:10px;border:0;background:var(--cobalt);color:#fff;border-radius:14px;padding:15px;font-size:17px;font-weight:700}
.btn-main:disabled{background:#B9C3DD;cursor:default}
.btn-line{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}
.btn-line.small{padding:6px 10px;font-size:12.5px;border-width:1px}
.catbox{border-top:1px solid var(--line);padding:10px 0}
.cat-h{display:flex;justify-content:space-between;align-items:center}
.add-line{display:flex;gap:8px;margin-top:6px}
.add-line .btn-line{white-space:nowrap}
.btn-line.danger{border-color:var(--red);color:var(--red)}
.btn-col{display:flex;flex-direction:column;gap:10px}

.alerts{margin:12px 0}
.alert{border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:8px;border-left:5px solid}
.alert.warn{background:#FCF1DE;border-color:var(--amber)}
.alert.over{background:#FBE5E2;border-color:var(--red)}

.ticket{position:relative;display:flex;background:var(--cobalt);color:#fff;border-radius:18px;margin:18px 0 12px}
.ticket-main{flex:1;min-width:0;padding:16px 14px 16px 16px}
.ticket-stub{width:112px;padding:14px 10px;border-left:2px dashed rgba(255,255,255,.5);display:flex;flex-direction:column;justify-content:center}
.ticket::before,.ticket::after{content:"";position:absolute;right:104px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
.ticket::before{top:-8px}
.ticket::after{bottom:-8px}
.t-label{font-size:13px;opacity:.85}
.t-num{font-size:30px;font-weight:800;line-height:1.2;margin:2px 0 8px}
.t-bar{height:7px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.t-bar i{display:block;height:100%;background:#fff;border-radius:99px}
.t-sub{font-size:12.5px;margin-top:6px;opacity:.9}
.t-btn{margin-top:10px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.s-small{font-size:11.5px;opacity:.85}
.s-big{font-size:30px;font-weight:800;line-height:1.1}
.s-big span{font-size:13px;font-weight:600;margin-left:2px}
.s-mid{font-size:16px;font-weight:700}
.ticket-stub .s-mid{margin-top:0}
.ticket-stub .s-small+.s-big{margin-bottom:8px}

.month-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:6px 4px}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:120px;border:0;background:transparent;padding:14px 0 12px;font-size:14px;font-weight:600;color:var(--ink2);border-top:3px solid transparent;margin-top:-1px}
.nav button.on{color:var(--cobalt);border-top-color:var(--cobalt)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:5}

.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.month-nav button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink)}
.month-nav button:disabled{opacity:.4;cursor:default}
.day{padding:10px 14px}
.day-h{font-size:12.5px;color:var(--ink2);margin-bottom:2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.day-h+.row{border-top:0}
.row-t{font-size:15px;font-weight:600}
.row-s{font-size:12.5px;color:var(--ink2)}
.row-amt{font-size:16px;font-weight:700;white-space:nowrap}
.row-amt.pos{color:var(--teal)}
.row-amt.neu{color:var(--ink2)}
.del{margin-top:8px;border:1.5px solid var(--red);color:var(--red);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px}
.empty{color:var(--ink2);font-size:14px;padding:18px 4px}

.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar-pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bar-pair i{display:block;width:42%;min-height:2px;border-radius:5px 5px 0 0}
.b-in{background:var(--teal)}
.b-out{background:var(--ink)}
.bar-m{font-size:11.5px;color:var(--ink2);margin-top:4px}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:8px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:8px}
.lg:first-child{margin-left:0}
.lg.in{background:var(--teal)}
.lg.out{background:var(--ink)}
.sum-line{font-size:13.5px;margin-top:8px}
.line{width:100%;height:auto;margin-top:4px}
.cmp{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.cmp-n{flex:1}
.cmp-a{font-weight:700}
.cmp-d{width:92px;text-align:right;font-size:13px;color:var(--ink2)}
.cmp-d.up{color:var(--red)}
.cmp-d.down{color:var(--teal)}
.para{font-size:14px;margin:6px 0}

.acct{border-top:1px solid var(--line);padding:12px 0}
.acct:first-of-type{border-top:0}
.acct-h{display:flex;align-items:center;gap:8px}
.tag{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.lab{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
.add-acct{display:flex;gap:8px;align-items:center;margin-top:8px}
.add-acct .seg{flex:1;margin-top:0}
.bud .lab{margin-top:8px}
.csv textarea{width:100%;height:130px;margin-top:10px;font-size:12px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-family:ui-monospace,monospace}
.csv .btn-line{margin-top:8px}
.savewarn{margin-bottom:12px}

.shortcuts{display:flex;gap:8px;margin:4px 0 10px}
.shortcuts button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600}
.varentry{border-color:var(--cobalt)}
.ve-h{font-size:14.5px;font-weight:700;margin-bottom:8px}
.ve-row{display:flex;align-items:center;gap:8px}
.yen.small{font-size:18px}
.outlook{cursor:pointer}
.ol-h{font-size:13px;color:var(--ink2);margin-bottom:6px}
.ol-row{display:flex;justify-content:space-between;gap:8px}
.ol-m{font-size:12px;color:var(--ink2)}
.ol-v{font-size:19px;font-weight:800}
.ol-v.neg,.neg-text{color:var(--red)}
.pos-text{color:var(--teal)}
.ol-warn{margin-top:8px;font-size:13px;color:var(--red);font-weight:600}
.fc-table{margin-top:6px;font-size:12.5px}
.fc-head,.fc-row{display:grid;grid-template-columns:34px 1fr 1fr 1fr 1.2fr;gap:4px;padding:7px 0;border-top:1px solid var(--line);text-align:right}
.fc-head{color:var(--ink2);border-top:0;font-size:11.5px}
.fc-head span:first-child,.fc-row span:first-child{text-align:left}
.rule{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.rule:first-of-type{border-top:0}
.rule-foot{margin-top:6px}
select.inp{appearance:auto}
.cardline{margin-top:3px}
.cardsub{font-size:12px;color:var(--ink2)}
.billing{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.bill-h{font-size:13.5px;font-weight:700}
.bill-list{margin-top:10px;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13.5px}
.bill-list div{display:flex;justify-content:space-between;padding:3px 0}
.savestat{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:12px;color:var(--ink2);margin:-6px 0 6px}
.savestat i{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}
.filebtn{display:block;text-align:center;cursor:pointer}
.mo-big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.mo-big span{font-size:13px;color:var(--ink2)}
.mo-big b{font-size:26px;font-weight:800}
.mo-r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.mo-r em{font-style:normal;font-size:12px;color:var(--ink2)}
.mo-sub{font-size:13px;font-weight:700;margin:14px 0 4px}
.mo-pay{background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:8px}
.mo-ph{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.mo-pr{display:flex;gap:12px}
.mo-pr>div{flex:1}
.mo-pr small{display:block;font-size:11.5px;color:var(--ink2)}
.mo-pr b{font-size:18px}
.sync-line{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--ink2)}
.dot.ok{background:var(--teal)}
.dot.ng{background:var(--red)}
.dot.wait{background:var(--amber)}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important;animation:none!important}}
